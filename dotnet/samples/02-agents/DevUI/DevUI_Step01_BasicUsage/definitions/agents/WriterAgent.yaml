# Agent definition (kind: Prompt). Authored as data; loaded at runtime by
# ChatClientPromptAgentFactory.CreateFromYamlAsync. This is the kind of artifact an
# agent-editing FORM would produce (system prompt, model options, tools...).
kind: Prompt
name: WriterAgent
description: Drafts a first version of the requested content.
instructions: |
  You are a concise copywriter. Write a short first draft (2-3 full sentences of
  plain English prose) responding to the user's request. Do not wrap your answer in
  quotation marks, code fences, or JSON.
model:
  options:
    temperature: 0.7
